[package]
name = "zedr-ledger"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Commitments and sealing for zedr telemetry"

[dependencies]
sha2 = "0.10"
borsh = { version = "1", features = ["derive"] }
hmac = { version = "0.12", optional = true }
chacha20poly1305 = { version = "0.10", optional = true }

[features]
default = []
seal = ["dep:hmac", "dep:chacha20poly1305"]

[dev-dependencies]
hex = "0.4"
