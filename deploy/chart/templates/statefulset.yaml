{{- $serverUrl := include "zedr.serverUrl" . -}}
{{- $secretName := include "zedr.secretName" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "zedr.fullname" . }}
  labels:
    {{- include "zedr.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "zedr.fullname" . }}
  # The database is one SQLite file, so a second replica would corrupt or fork it.
  replicas: 1
  selector:
    matchLabels:
      {{- include "zedr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "zedr.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-server
          image: {{ include "zedr.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: ZEDR_SERVER_HOST
              value: "0.0.0.0"
            - name: ZEDR_SERVER_PORT
              value: {{ include "zedr.containerPort" . | quote }}
            - name: DATABASE_URL
              value: sqlite:///data/zedr.sqlite?mode=rwc
            - name: ZEDR_SERVER_URL
              value: {{ $serverUrl | quote }}
            - name: ZEDR_CORS_ORIGIN
              value: {{ $serverUrl | quote }}
            - name: ZEDR_AGENT_VERSION
              value: {{ required "server.agentVersion is required" .Values.server.agentVersion | quote }}
            - name: ZEDR_TLS_CERT_PATH
              value: /tls/tls.crt
            - name: ZEDR_TLS_KEY_PATH
              value: /tls/tls.key
            {{- with .Values.server.adminAllowedCidrs }}
            - name: ZEDR_ADMIN_ALLOWED_CIDRS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.server.signingKeyChangeAccepted }}
            - name: ZEDR_SIGNING_KEY_CHANGE_ACCEPTED
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.server.logLevel }}
            - name: ZEDR_LOG_LEVEL
              value: {{ . | quote }}
            {{- end }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: JWT_SECRET
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: ADMIN_PASSWORD
            - name: ZEDR_SIGNING_KEY_HEX
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: ZEDR_SIGNING_KEY_HEX
          ports:
            - name: https
              containerPort: {{ include "zedr.containerPort" . }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: HTTPS
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: {{ include "zedr.tlsSecretName" . }}
            defaultMode: 0440
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- with .Values.persistence.storageClassName }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
