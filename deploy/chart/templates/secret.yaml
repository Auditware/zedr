{{- if eq .Values.secrets.mode "create" }}
{{- $signingKey := required "secrets.signingKeyHex is required when secrets.mode=create" .Values.secrets.signingKeyHex -}}
{{- if not (regexMatch "^[0-9a-fA-F]{64}$" $signingKey) -}}
{{- fail "secrets.signingKeyHex must be 64 hex characters (the 32 byte Ed25519 seed)" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "zedr.secretName" . }}
  labels:
    {{- include "zedr.labels" . | nindent 4 }}
type: Opaque
data:
  JWT_SECRET: {{ required "secrets.jwtSecret is required when secrets.mode=create" .Values.secrets.jwtSecret | b64enc }}
  ADMIN_PASSWORD: {{ required "secrets.adminPassword is required when secrets.mode=create" .Values.secrets.adminPassword | b64enc }}
  ZEDR_SIGNING_KEY_HEX: {{ $signingKey | b64enc }}
{{- end }}
