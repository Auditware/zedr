[package]
name = "zedr-prover"
version = "0.1.0"
edition = "2021"
description = "Proves that the zedr rules ran over a run of sealed windows"
build = "build.rs"

[workspace]

[dependencies]
zedr-rules = { path = "../../rules" }
zedr-protocol = { path = "../../protocol" }
bincode = "1.3"
hex = "0.4"

# Linux endpoints prove in-process, so the prover is one file with nothing else to install.
[target.'cfg(not(target_os = "macos"))'.dependencies]
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["prove"] }

# On macOS the in-process prover needs the Metal compiler of a full Xcode, so development machines hand the work to the r0vm that rzup installs.
[target.'cfg(target_os = "macos")'.dependencies]
risc0-zkvm = { version = "=3.1.0", default-features = false, features = ["client"] }

# The allocator of musl takes one lock for every allocation, and a proof allocates from every core at once.
# With it the static prover spent more time waiting in the kernel than proving.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[profile.release]
strip = true
