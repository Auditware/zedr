[package]
name = "zedr-protocol"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
borsh = { version = "1", features = ["derive"] }
base64 = "0.22"
utoipa = { version = "5", optional = true }

[features]
default = []
utoipa = ["dep:utoipa"]
