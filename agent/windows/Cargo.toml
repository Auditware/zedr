[package]
name = "zedr-agent-windows"
version = "0.1.0"
edition = "2021"
authors = ["zedr contributors"]
description = "Zero-knowledge Endpoint Detection & Response Agent for Windows"
license = "MIT"

[dependencies]
zedr-agent-shared = { path = "../shared" }
zedr-protocol = { path = "../../protocol" }
windows-service = "0.7"
minreq = { version = "2.14", features = ["https-native"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
winreg = "0.52"
tokio = { version = "1", features = ["rt"] }
windows = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading"
] }
