[package]
name = "zedr-agent-windows"
version = "0.1.0"
edition = "2021"
authors = ["zedr contributors"]
description = "Zero-knowledge Endpoint Detection & Response Agent for Windows"
license = "MIT"

[dependencies]
zedr-agent-shared = { path = "../shared" }
zedr-protocol = { path = "../../protocol" }
windows-service = "0.7"
minreq = { version = "2.14", features = ["https-native"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
winreg = "0.52"
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["rt"] }
windows = { version = "0.52", features = [
    "Wdk_System_Threading",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading"
] }
