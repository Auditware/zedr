[package]
name = "zedr-agent-shared"
version = "0.1.0"
edition = "2021"
authors = ["zedr contributors"]
description = "Shared components for zedr EDR agents across all platforms"
license = "MIT"

[dependencies]
zedr-protocol = { workspace = true }
zedr-ledger = { workspace = true }
zedr-rules = { workspace = true }
borsh = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ed25519-dalek = "2.1"
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
quick-xml = "0.42"

[dev-dependencies]
quick-xml = "0.42"

[target.'cfg(target_os = "linux")'.dependencies]
minreq = { version = "2.12", features = ["https-rustls-probe"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
minreq = { version = "2.12", features = ["https-native"] }

[lib]
name = "zedr_shared"
path = "src/lib.rs"
